<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masaharu Fukuyama - Live Archive</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&display=swap');
        
        body {
            font-family: 'Noto Sans JP', sans-serif;
            background-color: #0a0a0c;
            color: #f4f4f5;
            overflow-x: hidden;
        }

        .era-dawn { --era-color: #3b82f6; --era-bg: rgba(59, 130, 246, 0.1); }
        .era-golden { --era-color: #fbbf24; --era-bg: rgba(251, 191, 36, 0.1); }
        .era-dome { --era-color: #ec4899; --era-bg: rgba(236, 72, 153, 0.1); }
        .era-resonance { --era-color: #10b981; --era-bg: rgba(16, 185, 129, 0.1); }

        .era-card-header {
            border-left: 4px solid var(--era-color);
            background: linear-gradient(90deg, var(--era-bg), transparent);
        }

        .attended-card {
            background: linear-gradient(145deg, var(--era-bg), rgba(0, 0, 0, 0.4));
            border-color: var(--era-color) !important;
            box-shadow: 0 0 15px var(--era-bg);
            transform: translateY(-2px);
        }

        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #0a0a0c; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #27272a; border-radius: 10px; }
        
        .tour-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 1rem;
        }

        .login-card {
            background: rgba(18, 18, 20, 0.9);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .gold-button {
            background: linear-gradient(to right, #d97706, #fbbf24);
            transition: all 0.3s ease;
        }

        .live-btn {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
    </style>
</head>
<body class="custom-scrollbar min-h-screen">

    <!-- Auth Modal -->
    <div id="auth-modal" class="fixed inset-0 z-[100] flex items-center justify-center p-4 bg-black/90">
        <div class="login-card w-full max-w-md p-8 rounded-3xl relative overflow-hidden shadow-2xl">
            <div class="text-center mb-10">
                <div class="inline-flex p-4 bg-zinc-800 rounded-2xl border border-amber-500/30 mb-6">
                    <i data-lucide="library" class="w-10 h-10 text-amber-500"></i>
                </div>
                <h2 class="text-3xl font-black text-white italic uppercase mb-1">Live Archive</h2>
                <p class="text-xs text-amber-500 font-bold tracking-widest uppercase">M. Fukuyama 35th Anniversary</p>
            </div>
            
            <div class="space-y-4">
                <div class="relative">
                    <i data-lucide="user" class="absolute left-4 top-4 w-5 h-5 text-zinc-500"></i>
                    <input type="text" id="modal-user-id" placeholder="ユーザー名 (英数字)" class="w-full bg-zinc-900 border border-zinc-800 rounded-xl pl-12 pr-5 py-4 text-white font-bold focus:border-amber-500 outline-none">
                </div>
                <div class="relative">
                    <i data-lucide="key-round" class="absolute left-4 top-4 w-5 h-5 text-zinc-500"></i>
                    <input type="password" id="modal-user-pin" placeholder="PIN (4桁以上)" class="w-full bg-zinc-900 border border-zinc-800 rounded-xl pl-12 pr-5 py-4 text-amber-500 font-mono text-lg focus:border-amber-500 outline-none">
                </div>
                
                <div class="flex flex-col gap-3 pt-4">
                    <button id="login-btn" class="gold-button w-full text-black font-black py-4 rounded-xl uppercase tracking-tighter text-lg shadow-lg active:scale-95 transition-transform">ログイン</button>
                    <button id="register-btn" class="w-full bg-zinc-800 hover:bg-zinc-700 text-zinc-300 font-bold py-4 rounded-xl text-sm uppercase tracking-widest transition-colors">新規アーカイブ作成</button>
                    <button id="guest-btn" class="w-full text-zinc-500 font-bold py-2 rounded-xl text-[10px] uppercase tracking-widest hover:text-zinc-300 transition-colors">ゲストモード (保存なし)</button>
                </div>
                <p id="auth-error" class="text-red-500 text-xs font-bold text-center mt-2 h-4 hidden"></p>
                <div id="auth-loading" class="text-amber-500 text-xs font-bold text-center mt-2 flex items-center justify-center gap-2">
                    <span class="animate-spin h-3 w-3 border-2 border-amber-500 border-t-transparent rounded-full"></span> <span id="auth-loading-text">サーバー接続中...</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Main App -->
    <div id="main-app" class="hidden">
        <header class="sticky top-0 z-50 bg-[#0a0a0c]/90 border-b border-zinc-800 backdrop-blur-md">
            <div class="max-w-7xl mx-auto px-4 py-4 flex flex-col md:flex-row items-center justify-between gap-4">
                <div class="flex items-center gap-4">
                    <div class="p-3 bg-amber-500 rounded-xl shadow-lg">
                        <i data-lucide="disc" class="w-6 h-6 text-black"></i>
                    </div>
                    <div>
                        <h1 class="text-xl font-black text-white italic tracking-tight">MASAHARU FUKUYAMA</h1>
                        <div class="flex items-center gap-2">
                            <span class="text-[10px] text-amber-500 font-bold uppercase tracking-widest">Archive ID:</span>
                            <span id="display-user-id" class="text-xs text-white font-mono font-bold">---</span>
                        </div>
                    </div>
                </div>

                <div class="flex gap-2 bg-zinc-900/50 p-2 rounded-xl border border-zinc-800">
                    <div class="text-center min-w-[80px] py-1">
                        <p class="text-[9px] text-zinc-500 font-black uppercase">全公演</p>
                        <p id="total-count" class="text-xl font-black text-amber-500">0</p>
                    </div>
                    <div class="text-center min-w-[80px] py-1 border-l border-zinc-800">
                        <p class="text-[9px] text-zinc-500 font-black uppercase">参戦済</p>
                        <p id="attended-count" class="text-xl font-black text-white">0</p>
                    </div>
                    <div class="text-center min-w-[80px] py-1 border-l border-zinc-800">
                        <p class="text-[9px] text-zinc-500 font-black uppercase">参戦率</p>
                        <p id="attendance-rate" class="text-xl font-black text-white">0%</p>
                    </div>
                </div>
            </div>
            
            <div class="bg-black/40 px-6 py-2 flex items-center justify-between text-[10px] font-bold">
                <div class="flex items-center gap-2">
                    <div id="sync-status-icon" class="w-2 h-2 rounded-full bg-zinc-600"></div>
                    <span id="sync-status-text" class="text-zinc-500 uppercase tracking-widest">Offline</span>
                </div>
                <button onclick="logout()" class="text-zinc-500 hover:text-red-400 transition-colors flex items-center gap-1 uppercase tracking-widest">
                    <i data-lucide="log-out" class="w-3 h-3"></i> Logout
                </button>
            </div>
            <div class="w-full h-1.5 bg-zinc-900">
                <div id="progress-bar" class="h-full bg-amber-500 shadow-[0_0_10px_rgba(245,158,11,0.5)] transition-all duration-700" style="width: 0%"></div>
            </div>
        </header>

        <main class="max-w-7xl mx-auto px-4 py-12">
            <div id="live-list" class="space-y-24"></div>
        </main>

        <footer class="py-20 border-t border-zinc-900 text-center text-zinc-600">
            <div class="mb-4 flex justify-center gap-6">
                <i data-lucide="instagram" class="w-5 h-5"></i>
                <i data-lucide="twitter" class="w-5 h-5"></i>
                <i data-lucide="youtube" class="w-5 h-5"></i>
            </div>
            <p class="text-[10px] tracking-[0.3em] font-bold uppercase italic">© Masaharu Fukuyama Official Archive System</p>
        </footer>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // --- Firebase Configuration ---
        const firebaseConfig = {
            apiKey: "AIzaSyAtJmQ9w46JR31H9LBUHnNccLBZHSQXH1Q",
            authDomain: "fukuyama-80cf4.firebaseapp.com",
            projectId: "fukuyama-80cf4",
            storageBucket: "fukuyama-80cf4.firebasestorage.app",
            messagingSenderId: "348267257207",
            appId: "1:348267257207:web:8e095b8ca3bd40fe789572",
            measurementId: "G-QQL8QMRJN0"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = "fukuyama-live-v5";

        const build = (prefix, year, venues) => venues.map((v, i) => ({ id: `${prefix}-${year}-${i}`, d: year, v }));
        const ARENA = ["横浜アリーナ", "大阪城ホール", "日本ガイシホール", "マリンメッセ福岡", "真駒内セキスイハイム", "セキスイハイム宮城", "広島グリーンアリーナ", "さいたまスーパーアリーナ", "日本武道館", "サンドーム福井", "朱鷺メッセ", "エコパアリーナ", "愛媛県武道館", "鹿児島アリーナ"];
        const DOMES = ["東京ドーム", "京セラドーム大阪", "ナゴヤドーム", "福岡PayPayドーム", "札幌ドーム"];

        const LIVE_DATA = [
            { era: "1990 - 1999", class: "era-dawn", icon: "zap", label: "DAWN / THE BEGINNING", tours: [
                { title: "Early Gigs & Hall Tours", items: build('ear', '90-92', ["渋谷eggman", "新宿ロフト", "名古屋ハートランド", "大阪バナナホール", "渋谷公会堂", "中野サンプラザ"]) },
                { title: "WE'RE BROS. TOUR '93", items: build('wb93', '1993', ["渋谷公会堂", "大阪厚生年金", "福岡市民会館", "名古屋市民"]) },
                { title: "TOUR '94 'ON AND ON'", items: build('on94', '1994', ARENA.slice(0, 6)) },
                { title: "TOUR '98 'LIKE A HURRICANE'", items: build('lh98', '1998', ARENA) }
            ]},
            { era: "2000 - 2009", class: "era-golden", icon: "star", label: "GOLDEN ERA / MAGNUM", tours: [
                { title: "10th Anniv. MAGNUM LIVE", items: build('mag', '2000', ["稲佐山公園", "横浜アリーナ"]) },
                { title: "玉卵 TOUR '01 'f'", items: build('f01', '2001', ARENA) },
                { title: "17年モノ TOUR 2007", items: build('17m', '2007', ARENA) },
                { title: "道標 TOUR 2009 / 稲佐山", items: build('mi09', '2009', [...ARENA.slice(0, 8), "長崎 稲佐山公園"]) }
            ]},
            { era: "2010 - 2019", class: "era-dome", icon: "map-pin", label: "DOME & ASIA EXPANSION", tours: [
                { title: "THE LIVE BANG!! (2011)", items: build('lb11', '2011', ARENA) },
                { title: "DOME TOUR 2014 'HUMAN'", items: build('hu14', '2014', [...DOMES, "台北アリーナ", "香港エキスポ"]) },
                { title: "夏だ! 稲佐山だ! 2015", items: build('ina15', '2015', ["長崎 稲佐山公園 (2DAYS)"]) },
                { title: "WE'RE BROS. TOUR 2018", items: build('wb18', '2018', ARENA) }
            ]},
            { era: "2020 - 2026", class: "era-resonance", icon: "radio", label: "RESONANCE / 35TH ANNIV.", tours: [
                { title: "言霊の幸わう夏 2023", items: build('ko23', '2023', ["日本武道館 (3DAYS)"]) },
                { title: "35th Anniv. Resonance Tour 2024", items: build('r24', '2024', ARENA) },
                { title: "35th Anniv. Resonance Tour 2025", items: build('r25', '2025', DOMES) },
                { title: "冬の大感謝祭 (其の三〜其の二十二)", items: Array.from({length: 20}, (_, i) => ({ id: `th-${i+3}`, d: `${2001+i}`, v: `其の${i+3}: パシフィコ横浜 / Kアリーナ` })) }
            ]}
        ];

        let attendedShows = new Set();
        let userSyncId = "", userPin = "", isFirebaseReady = false;

        const showError = (msg) => {
            const el = document.getElementById('auth-error'); el.innerText = msg; el.classList.remove('hidden');
            setTimeout(() => el.classList.add('hidden'), 5000);
        };

        const getUserDocRef = (id) => doc(db, 'artifacts', appId, 'public', 'data', 'users', id.toLowerCase().replace(/[^a-z0-9]/g, '_'));

        async function handleAuth(mode) {
            if (!isFirebaseReady && mode !== 'guest') return showError("サーバー接続待ちです...");
            
            const id = document.getElementById('modal-user-id').value.trim();
            const pin = document.getElementById('modal-user-pin').value.trim();
            
            if (mode === 'guest') { loginSuccess("GUEST", "", []); return; }
            if (!id || pin.length < 4) return showError("IDと4桁以上のPINを入力してください");
            
            const docRef = getUserDocRef(id);
            try {
                const snap = await getDoc(docRef);
                if (mode === 'register') {
                    if (snap.exists()) return showError("そのIDは既に使用されています");
                    await setDoc(docRef, { pin, attended: [], createdAt: Date.now() });
                    loginSuccess(id, pin, []);
                } else {
                    if (!snap.exists() || snap.data().pin !== pin) return showError("IDまたはPINが正しくありません");
                    loginSuccess(id, pin, snap.data().attended || []);
                }
            } catch (e) { showError("認証エラー: " + e.message); }
        }

        function loginSuccess(id, pin, data) {
            userSyncId = id.toLowerCase(); userPin = pin; attendedShows = new Set(data);
            if (id !== "GUEST") {
                localStorage.setItem('f_id_v5', id); 
                localStorage.setItem('f_pin_v5', pin);
                initSync();
            } else {
                updateSyncStatus('offline', 'Guest Mode');
            }
            document.getElementById('auth-modal').classList.add('hidden');
            document.getElementById('main-app').classList.remove('hidden');
            document.getElementById('display-user-id').innerText = id;
            render(); 
            updateStats();
        }

        window.logout = () => { localStorage.clear(); location.reload(); };

        function initSync() {
            if (userSyncId === "guest") return;
            onSnapshot(getUserDocRef(userSyncId), (snap) => {
                if (snap.exists() && snap.data().pin === userPin) {
                    attendedShows = new Set(snap.data().attended || []);
                    render(); updateStats(); updateSyncStatus('active', 'Online');
                }
            }, (err) => updateSyncStatus('error', 'Sync Offline'));
        }

        async function saveToCloud() {
            if (userSyncId === "guest") { updateSyncStatus('offline', 'Local Only'); return; }
            updateSyncStatus('syncing', 'Updating Cloud...');
            try {
                await setDoc(getUserDocRef(userSyncId), { pin: userPin, attended: Array.from(attendedShows), updatedAt: Date.now() }, { merge: true });
                updateSyncStatus('active', 'Cloud Synced');
            } catch (e) { updateSyncStatus('error', 'Save Error'); }
        }

        function toggleShow(id) {
            attendedShows.has(id) ? attendedShows.delete(id) : attendedShows.add(id);
            saveToCloud(); render(); updateStats();
        }

        function updateSyncStatus(s, m) {
            const ic = document.getElementById('sync-status-icon');
            const txt = document.getElementById('sync-status-text');
            if (txt) txt.innerText = m;
            if (ic) ic.className = `w-2 h-2 rounded-full ${s === 'active' ? 'bg-green-500' : s === 'syncing' ? 'bg-amber-500 animate-pulse' : s === 'offline' ? 'bg-zinc-600' : 'bg-red-500'}`;
        }

        function updateStats() {
            let total = 0; LIVE_DATA.forEach(e => e.tours.forEach(t => total += t.items.length));
            const count = attendedShows.size;
            const rate = total === 0 ? 0 : Math.round((count / total) * 100);
            document.getElementById('total-count').innerText = total;
            document.getElementById('attended-count').innerText = count;
            document.getElementById('attendance-rate').innerText = rate + '%';
            document.getElementById('progress-bar').style.width = rate + '%';
        }

        function render() {
            const container = document.getElementById('live-list');
            if (!container) return;
            container.innerHTML = '';
            LIVE_DATA.forEach(era => {
                const sec = document.createElement('div');
                sec.className = era.class;
                sec.innerHTML = `
                    <div class="era-card-header p-4 rounded-r-xl mb-10 flex items-center justify-between">
                        <div class="flex items-center gap-4">
                            <div class="p-2 bg-black/40 rounded-lg"><i data-lucide="${era.icon}" class="w-6 h-6 text-[var(--era-color)]"></i></div>
                            <div>
                                <h2 class="text-2xl font-black text-white italic tracking-tighter">${era.era}</h2>
                                <p class="text-[10px] font-bold text-[var(--era-color)] tracking-[0.3em] uppercase">${era.label}</p>
                            </div>
                        </div>
                    </div>
                    <div class="space-y-16 pl-2 md:pl-6">${era.tours.map(tour => `
                        <div>
                            <div class="flex items-center gap-3 mb-6">
                                <span class="h-2 w-2 rounded-full bg-[var(--era-color)]"></span>
                                <h3 class="text-sm md:text-base font-bold text-white uppercase tracking-wider">${tour.title}</h3>
                            </div>
                            <div class="tour-grid">${tour.items.map(item => {
                                const attended = attendedShows.has(item.id);
                                return `
                                <button data-id="${item.id}" class="live-btn group flex flex-col p-5 rounded-2xl border text-left ${attended ? 'attended-card' : 'bg-zinc-900/30 border-zinc-800 hover:border-[var(--era-color)]/50'}">
                                    <div class="flex justify-between items-center mb-3">
                                        <span class="text-[10px] font-bold text-zinc-500 uppercase tracking-tighter">${item.d}</span>
                                        <div class="w-5 h-5 rounded-full border-2 border-zinc-700 flex items-center justify-center ${attended ? 'bg-[var(--era-color)] border-[var(--era-color)]' : ''}">
                                            ${attended ? '<i data-lucide="check" class="w-3 h-3 text-black stroke-[4]"></i>' : ''}
                                        </div>
                                    </div>
                                    <p class="text-sm md:text-base font-bold leading-tight ${attended ? 'text-white' : 'text-zinc-400 group-hover:text-zinc-200'}">${item.v}</p>
                                </button>`;
                            }).join('')}
                            </div>
                        </div>`).join('')}
                    </div>`;
                container.appendChild(sec);
            });
            lucide.createIcons();
            document.querySelectorAll('.live-btn').forEach(b => b.onclick = () => toggleShow(b.dataset.id));
        }

        window.onload = () => {
            lucide.createIcons();
            onAuthStateChanged(auth, async (user) => {
                if (user) {
                    isFirebaseReady = true;
                    document.getElementById('auth-loading').classList.add('hidden');
                    const sid = localStorage.getItem('f_id_v5'), spn = localStorage.getItem('f_pin_v5');
                    if (sid && spn) { 
                        document.getElementById('modal-user-id').value = sid;
                        document.getElementById('modal-user-pin').value = spn;
                        handleAuth('login');
                    }
                } else {
                    signInAnonymously(auth).catch(e => {
                        console.error("Auth Failed", e);
                        document.getElementById('auth-loading-text').innerText = "オフラインモード";
                    });
                }
            });
        };

        document.getElementById('login-btn').onclick = () => handleAuth('login');
        document.getElementById('register-btn').onclick = () => handleAuth('register');
        document.getElementById('guest-btn').onclick = () => handleAuth('guest');
    </script>
</body>
</html>
